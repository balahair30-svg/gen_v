<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 1. tentukan bilangan terbesar dari tiga angka
        let a = 10;
        let b = 25;
        let c = 15;

        if (a > b && a > c) {
            console.log("Bilangan terbesar: " + a);
        } else if (b > a && b > c) {
            console.log("Bilangan terbesar: " + b);
        } else {
            console.log("Bilangan terbesar: " + c);
        }

        // 2. tampilkan nama hari dengan switch, angka 1-7
        let hari = 3;

        switch (hari) {
            case 1:
                console.log("Senin");
                break;
            case 2:
                console.log("Selasa");
                break;
            case 3:
                console.log("Rabu");
                break;
            case 4:
                console.log("Kamis");
                break;
            case 5:
                console.log("Jumat");
                break;
            case 6:
                console.log("Sabtu");
                break;
            case 7:
                console.log("Minggu");
                break;
            default:
                console.log("Hari tidak valid");
                break;

        }
    </script>
</body>
</html>
