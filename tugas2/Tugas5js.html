<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //for loop
        for (let a = 1; a<=10; a++){
            console.log(a);
        }

        for (let a = 5; a>=1; a--){
            console.log(a);
        }
        console.log("Mulai");

        // while loop (penjumlahan 1 sampai 5)
        let angka = 1;
        let total = 0;

        while (angka <= 5) {
            total = total + angka;
            angka++;
        }

        console.log("Total: " + total);
    </script>
</body>
</html>
