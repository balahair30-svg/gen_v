<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function cariTerbesar(a, b, c) {
            if (a > b && a > c) {
                return a;
            } else if (b > a && b > c) {
                return b;
            } else {
                return c;
            }
        }

        // Contoh pemanggilan
        let hasil = cariTerbesar(10, 25, 15);
        console.log("Bilangan terbesar: " + hasil);
    </script>
</body>
</html>
